# Repository defaults, open to be extended per project.
repository:
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: BLANK
  delete_branch_on_merge: true
  allow_update_branch: true
  allow_auto_merge: true
  has_projects: false
  has_discussions: false
  has_wiki: false

labels:
  - name: breaking
    color: "6e1119"
    description: Requires action to adopt
  - name: bug
    color: "e5484d"
    description: Something is broken
  - name: chore
    color: "ededed"
    description: Internal housekeeping
  - name: docs
    color: "7057ff"
    description: Explains the project
  - name: feature
    color: "0e8a16"
    description: New capability
  - name: renovate
    color: "0075ca"
    description: Automated dependency update
  - name: security
    color: "fbca04"
    description: Vulnerability or hardening

rulesets:
  - name: main
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: pull_request
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          allowed_merge_methods:
            - squash
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: true
          required_review_thread_resolution: true
          require_code_owner_review: false
          require_last_push_approval: false
          required_reviewers: []
