version: "2"

linters:
  default: all
  disable:
    # Deprecated; their successors exhaustruct_v5, gomodguard_v2 and wsl_v5 run instead.
    - exhaustruct
    - gomodguard
    - wsl
  exclusions:
    rules:
      # Doc comments describe the code without repeating its name; their presence stays checked.
      - linters:
          - godoclint
          - revive
        text: (should be of the form|should start with)
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/Hansehart/harness
    gocritic:
      enable-all: true
    govet:
      enable-all: true
    revive:
      enable-all-rules: true
      rules:
        # Zero and one read as empty, first and single, not as magic values.
        - name: add-constant
          arguments:
            - allow-ints: "0,1"
    staticcheck:
      checks:
        - all
        # Doc comments describe the code without repeating its name.
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022

formatters:
  enable:
    # gofumpt is a stricter gofmt and gci orders imports, so each concern has one tool.
    - gci
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 80

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Every finding is reported, also when a line has several.
  uniq-by-line: false
